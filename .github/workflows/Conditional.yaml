name: Task 4 Conditionals

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Requirement 3: A job that only runs on push events, not on pull requests
  conditional-job:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: General step
        run: echo "Hello! This job only started because this is a push event."

      # Requirement 1: A step that only runs when the branch is main
      - name: Main branch check
        if: github.ref == 'refs/heads/main'
        run: echo "🚀 This step only executes because we are on the main branch."

      # Requirement 4: A step with continue-on-error: true
      - name: Risky step that fails
        id: risky_step
        continue-on-error: true
        run: |
          echo "Simulating a command failure..."
          exit 1

      # Requirement 2: A step that only runs when the previous step failed
      - name: Recovery handler
        if: failure()
        run: echo "⚠️ The previous step failed, but continue-on-error kept the pipeline alive so this handler could run!"
