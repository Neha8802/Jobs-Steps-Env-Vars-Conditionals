name: put everything togerther

on: push

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: linting
        run: echo "running linting job"


  test:
    runs-on: ubuntu-latest
    steps:
      - name: testing the job
        run: echo "running the test job"


  summary-job:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: summary job
        run: |
          if ${{ github.ref_name }} == 'main'
            echo "this is main branch push (branch: ${{ github.ref_name }})"
          else
            echo "this is feature branch push (branch: ${{ github.ref_name }})"
          fi

            echo "the commit message is ${{ github.event.commits[0].message }}
          
    
