name: job output workflow

on: push

jobs:
  jobs_output:
    runs-on: ubuntu-latest

    outputs:
      current_date: ${{ steps.get_date.outputs.date_value }}

    steps:
      - name: print the today date 
        id: get_date
        # FIXED: Added parentheses $(date) so it runs the system command
        run: echo "date_value=$(date)" >> $GITHUB_OUTPUT

  getting_date:
    needs: jobs_output
    runs-on: ubuntu-latest
    steps:
      - name: providing the date to outer world
        # FIXED: Added the missing closing double quote (") at the very end
        run: echo "date is ${{ needs.jobs_output.outputs.current_date }}"
